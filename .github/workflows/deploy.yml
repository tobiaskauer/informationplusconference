name: Deploy conference website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "2016/**"
      - "2018/**"
      - "2020/**"
      - "2021/**"
      - "2023/**"
      - "2025/**"
      - "2027/**"
      - ".github/workflows/deploy.yml"
      - ".nojekyll"
      - "CNAME"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CURRENT_EDITION_PATH: "2027"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.CURRENT_EDITION_PATH }}/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        working-directory: ${{ env.CURRENT_EDITION_PATH }}
        run: npm ci

      - name: Check Astro project
        working-directory: ${{ env.CURRENT_EDITION_PATH }}
        run: npm run check

      - name: Build current edition
        working-directory: ${{ env.CURRENT_EDITION_PATH }}
        run: npm run build

      - name: Add historical edition archives
        shell: bash
        run: |
          for archive in 2016 2018 2020 2021 2023 2025; do
            test -f "$archive/index.html"
            cp -R "$archive" "$CURRENT_EDITION_PATH/dist/"
          done
          cp CNAME "$CURRENT_EDITION_PATH/dist/CNAME"
          cp .nojekyll "$CURRENT_EDITION_PATH/dist/.nojekyll"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.CURRENT_EDITION_PATH }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
